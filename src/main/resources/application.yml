spring:
  application:
    name: membership-program
  datasource:
    url: jdbc:h2:mem:membershipdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Application-specific defaults. Tier thresholds and benefits are seeded as data
# (see DemoDataSeeder) so they remain fully configurable at runtime via the APIs.
logging:
  level:
    com.firstclub.membership: INFO
